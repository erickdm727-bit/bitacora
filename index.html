<style>
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#18202B; --muted:#5B6576; --line:#D4D9E0;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-2:#9DB3F2; --done:#2E9A57; --danger:#C8322B;
  --body:#DCE1E8; --muscle:#C5CCD6; --chip:#E1E6EE;
  --head:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --text:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1B212A; --ink:#E7EBF0; --muted:#98A2B1; --line:#2B333E;
  --accent:#6F8CFF; --accent-ink:#0D1220; --accent-2:#34458A; --done:#46B872; --danger:#F06A60;
  --body:#262E39; --muscle:#36404D; --chip:#252C36;
}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B212A; --ink:#E7EBF0; --muted:#98A2B1; --line:#2B333E;
  --accent:#6F8CFF; --accent-ink:#0D1220; --accent-2:#34458A; --done:#46B872; --danger:#F06A60;
  --body:#262E39; --muscle:#36404D; --chip:#252C36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:1.6rem} h2{font-size:1.45rem} h3{font-size:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem .5rem;max-width:720px;margin:0 auto}
.top h1{flex:1}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.sync i{background:var(--done)} .status.err i{background:var(--danger)}
.iconbtn{background:none;border:0;padding:.35rem;border-radius:8px;color:var(--muted);display:grid;place-items:center}
main{max-width:720px;margin:0 auto;padding:.25rem 1rem 9rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:180px;background:none;border:0;padding:.55rem .2rem .6rem;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.15rem;border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:.75rem 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .9rem;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;display:block}
.btn.big{padding:.9rem 1rem;font-size:1.05rem}
.btn.sm{padding:.35rem .6rem;font-size:.85rem;border-radius:8px}
.btn.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:.25rem 0}
input.field,select.field,textarea.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.55rem .65rem}
label.lbl{display:block;font-size:.85rem;color:var(--muted);margin:.6rem 0 .25rem}
.hero{padding:1.1rem 0 .4rem}
.hero p{margin:.3rem 0 0;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:.75rem;width:100%;background:none;border:0;text-align:left;padding:.7rem 0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .5rem;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .75rem;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:.1rem .45rem;font-size:.78rem;color:var(--muted)}
/* workout */
.whead{display:flex;align-items:flex-end;gap:.75rem;margin-top:.8rem}
.whead input{flex:1;font-family:var(--head);font-weight:700;font-size:1.6rem;border:0;border-bottom:2px solid var(--line);background:transparent;padding:.1rem 0;min-width:0}
.elapsed{font-family:var(--head);font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.ex h3 button{all:unset;cursor:pointer}
.ex .exh{display:flex;align-items:flex-start;gap:.5rem}
.ex .exh .t{flex:1}
.sug{margin:.5rem 0 .2rem;padding:.45rem .6rem;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 8px 8px 0;font-size:.88rem}
.sets{width:100%;border-collapse:collapse;margin-top:.5rem;font-variant-numeric:tabular-nums}
.sets th{font-size:.75rem;font-weight:600;color:var(--muted);text-align:left;padding:.2rem .25rem}
.sets td{padding:.25rem;vertical-align:middle}
.sets td.n{font-family:var(--head);font-size:1.1rem;width:2rem;color:var(--muted)}
.sets td.prev{font-size:.82rem;color:var(--muted);white-space:nowrap}
.sets input{width:100%;min-width:3.2rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.45rem .4rem;text-align:center;font-weight:600}
.sets tr.done input{background:transparent;border-color:transparent}
.sets tr.done td.n{color:var(--done)}
.check{width:2.4rem;height:2.4rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--muted)}
tr.done .check,.cbox.done .check{background:var(--done);border-color:var(--done);color:#fff}
.cbox{border:1px solid var(--line);border-radius:10px;padding:.6rem;margin-top:.5rem}
.cbox.done{border-color:var(--done)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.5rem}
.cgrid label{font-size:.75rem;color:var(--muted)}
.cgrid input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.45rem;text-align:center;font-weight:600}
/* rest */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;width:min(560px,calc(100% - 1.5rem));background:var(--ink);color:var(--bg);border-radius:14px;padding:.6rem .8rem;display:flex;align-items:center;gap:.6rem}
#rest[hidden]{display:none}
#rest .time{font-family:var(--head);font-size:2rem;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:.35rem .6rem;font-weight:600;opacity:.9}
#rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 0 0 14px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,14,20,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#sheet .grab{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
#sheet .grab h2{flex:1}
.body-fig{width:100%;max-width:340px;display:block;margin:.3rem auto}
.body-fig .sil{fill:var(--body)} .body-fig .mb{fill:var(--muscle)} .body-fig .mp{fill:var(--accent)} .body-fig .ms{fill:var(--accent-2)}
.body-fig text{fill:var(--muted);font:600 7px var(--text);text-anchor:middle}
.legend{display:flex;gap:1rem;justify-content:center;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
ol.steps{padding-left:1.2rem;margin:.4rem 0} ol.steps li{margin:.3rem 0}
.err{border-left:3px solid var(--danger);padding:.3rem .6rem;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:10px;z-index:30;font-weight:600;font-size:.92rem;max-width:90%}
.stat{font-family:var(--head);font-size:1.7rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.stats span{font-size:.78rem;color:var(--muted)}
.ritem{display:grid;grid-template-columns:1fr 3.4rem 3.4rem 3.4rem auto;gap:.35rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--line)}
.ritem input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.4rem .2rem;text-align:center}
.ritem .nm{font-size:.92rem;min-width:0}
.rhead{font-size:.72rem;color:var(--muted);border-bottom:0;padding-bottom:0}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:.2rem .6rem;font-size:.9rem}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ #sheet.open .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

:root{--prot:#D6362F;--carb:#D99A00;--fat:#2E9A57;--water:#2F8FD8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--prot:#F06A60;--carb:#F2C14E;--fat:#46B872;--water:#5FB0F0}}
:root[data-theme="dark"]{--prot:#F06A60;--carb:#F2C14E;--fat:#46B872;--water:#5FB0F0}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-top:.6rem}
.seg button{flex:1;border:0;background:none;padding:.45rem .3rem;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.datenav{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.6rem 0 0}
.datenav .iconbtn{font-size:1.6rem;line-height:1;padding:.1rem .7rem}
.datenav .iconbtn:disabled{opacity:.3}
.stat.big{font-size:2.6rem}
.track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.track.tall{height:12px}
.track i{display:block;height:100%;border-radius:99px}
.mbar{margin:.55rem 0}
.mlab{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:.2rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid2 .card{margin:0}
.grid2.flat{gap:.2rem .75rem}
.card.tight{padding:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .5rem}
.chart{width:100%;display:block;margin-top:.3rem}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .dt{fill:var(--accent)}
.chart .ya{font:500 9px var(--text);fill:var(--muted);text-anchor:end}
.chart .xa{font:500 9px var(--text);fill:var(--muted)}
.chart .bar{fill:var(--accent-2)} .chart .bar.now{fill:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.8rem}
.ph{position:relative;border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;background:var(--chip);aspect-ratio:3/4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);color:#fff;font-size:.75rem;padding:.15rem}
.ph.sel{border-color:var(--accent)}
img.full{width:100%;border-radius:10px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cmp figure{margin:0} .cmp img{width:100%;border-radius:8px;display:block} .cmp figcaption{text-align:center;font-size:.85rem;color:var(--muted);margin-top:.2rem}
@media (max-width:380px){.grid2:not(.flat){grid-template-columns:1fr}}
.star{color:var(--carb)} .btn.fav.on{border-color:var(--carb);color:var(--ink)}
.field.pct{width:3.6rem;display:inline-block;padding:.3rem;text-align:center;margin-left:.3rem}
li.row2{display:flex;align-items:center;gap:.4rem} li.row2 .item{flex:1;min-width:0}
.toast .undo{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;margin-left:.4rem;padding:0}
.item.shop{cursor:pointer} .item.shop input{width:1.3rem;height:1.3rem;accent-color:var(--done);flex:none}
.item.shop .qty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.shop.got b,.item.shop.got .qty{text-decoration:line-through;color:var(--muted)}
.fig{width:100%;max-width:420px;display:block;margin:.3rem auto;background:var(--chip);border-radius:10px}
.fig line{stroke:var(--ink);stroke-linecap:round}.fig .far line{stroke:var(--muted);opacity:.7}.fig .head{fill:var(--ink)}.fig .torso{fill:var(--ink);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.fig .plate,.fig .db{fill:var(--accent)}.fig .hub{fill:var(--chip)}.fig .prop{fill:var(--muscle)}.fig .propl,.fig .leg{stroke:var(--muscle);stroke-width:3}.fig .cable{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 2;fill:none}
.fig .ring{fill:none;stroke:var(--muscle);stroke-width:3}.fig .ground{stroke:var(--muscle);stroke-width:2}.fig .arrow{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fig text{font:600 8px var(--text);fill:var(--muted);text-anchor:middle}
.wk{display:grid;gap:.35rem;margin-top:.6rem}.wkrow{display:grid;grid-template-columns:7.5rem 1fr;align-items:center;gap:.5rem;font-size:.95rem}.wkrow.today span{font-weight:700}.wkrow select{padding:.4rem .5rem}
.today-card{border-color:var(--accent)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem}
#login[hidden]{display:none}
#login .box{max-width:360px;width:100%;text-align:center}
#login h1{font-size:2.4rem;margin-bottom:.4rem}
#login p{color:var(--muted);margin:.2rem 0 1.4rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem}
.item.shop .qty{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem}
.price{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.82rem}
ol.prog li.cur{font-weight:600}
</style>
</head>

<script>
const LIB_ROWS = [

function queueWrite(id){

async function doWrite(id){

      doc:id=>({set:d=>F.setDoc(F.doc(F.db,...base,id),d),delete:()=>F.deleteDoc(F.doc(F.db,...base,id))}),
      limit:()=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(F.db,...base),{includeMetadataChanges:true},
        snap=>cb({docs:snap.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),metadata:{fromCache:snap.metadata.fromCache}}),err)})
    };
    let migrated=false;
    Sync.col.limit(1000).onSnapshot(snap=>{
      const remote={};
      snap.docs.forEach(d=>{if(d.exists)remote[d.id]=JSON.parse(JSON.stringify(d.data()))});
      const definitive=!snap.metadata.fromCache;
      if(definitive&&!migrated){migrated=true;Object.keys(docs).forEach(k=>{if(!(k in remote))queueWrite(k)})}
      if(definitive) for(const k of Object.keys(docs)) if(!(k in remote)&&!busy(k)) delete docs[k];
      for(const k in remote) if(!busy(k)) docs[k]=remote[k];
      saveLocal(); setStatus(definitive?'sync':'local'); requestRender();
    },err=>{console.error(err);setStatus('err');if(err&&err.code==='permission-denied')toast('Firestore rechazó el acceso. Revisa las reglas de seguridad.')});
  }catch(e){console.error(e);setStatus('local')}
}

function workouts(){return Object.entries(docs).filter(([k,v])=>v&&v.kind==='workout').map(([k,v])=>Object.assign({id:k},v)).sort((a,b)=>b.date-a.date)}
function sessionsFor(exId,excludeId){const out=[];for(const w of workouts()){if(w.id===excludeId)continue;const e=(w.exercises||[]).find(x=>x.exId===exId);if(e&&e.sets&&e.sets.length)out.push({date:w.date,sets:e.sets})}return out}
function fmtSet(t,s,f){
  if(!s)return '';
  if(t==='c'){return (f||'T').split('').filter(k=>num(s[k])).map(k=>num(s[k])+' '+CF[k][1]).join(', ')}

}

// progresión automática
const PROG=[
 {n:'Lagartijas',goal:12,ids:['lagartijas-rodillas','lagartijas-inclinadas','lagartijas','lagartijas-diamante','lagartijas-declinadas','lagartijas-arquero','lagartijas-una-mano-inclinada','lagartijas-una-mano']},
 {n:'Dominadas',goal:10,ids:['remo-invertido','dominadas-negativas','dominadas-banda','dominadas-supinas','dominadas','dominadas-arquero']},
 {n:'Fondos',goal:12,ids:['fondos-banco','fondos-triceps']},
 {n:'Sentadilla a una pierna',goal:12,ids:['sentadilla-libre','zancada-inversa','sentadilla-bulgara','sentadilla-cosaca','sentadilla-pistola']},
 {n:'Empuje vertical',goal:10,ids:['flexiones-pica','flexiones-pica-elevadas','flexiones-pino']},
 {n:'Abdomen',goal:12,ids:['crunch-inverso','elevacion-piernas-acostado','elevacion-rodillas-colgado','elevacion-piernas-colgado']},
 {n:'Glúteo',goal:15,ids:['puente-gluteo','puente-una-pierna','hip-thrust']},
];
function chainOf(id){for(const c of PROG){const k=c.ids.indexOf(id);if(k>=0)return Object.assign({k},c)}return null}
function nextInChain(id){const c=chainOf(id);return c&&c.k<c.ids.length-1&&exById(c.ids[c.k+1])?c.ids[c.k+1]:null}
function defTarget(ex,last){if(ex.t==='w')return{sets:last.length,rmin:8,rmax:12};const c=chainOf(ex.id);const g=c?c.goal:15;return{sets:3,rmin:Math.max(3,Math.round(g/2)),rmax:g}}
function suggestion(ex,target){
  if(!ex)return null;
  const ses=sessionsFor(ex.id,docs.active&&docs.active.editId);
  if(!ses.length)return null;
  const last=ses[0].sets,nx=nextInChain(ex.id),nxN=nx?exById(nx).n:'';
  if(ex.t==='c'){const b=last.reduce((a,x)=>num(x.T)>num(a.T)?x:a,last[0]||{});const T=num(b.T);
    if(!T)return{msg:`Última vez: ${fmtSet('c',b,ex.f)}. Hoy intenta superarlo un poco.`};
    const nt=Math.ceil(T*1.1);return{c:{T:nt},msg:`Última vez: ${fmtSet('c',b,ex.f)}. Hoy busca ${nt} min, o mantén el tiempo y sube un poco la velocidad, inclinación o resistencia.`}}
  const w=Math.max(...last.map(s=>num(s.w)));
  if(ex.t==='t'){const best=Math.max(...last.map(s=>num(s.r)));
    if(best>=60&&nx)return{w,r:best,next:nx,msg:`Aguantaste ${best} s. Ya puedes pasar a ${nxN}.`};
    if(best>=60)return{w,r:best,msg:`Aguantaste ${best} s. Agrega peso o usa una variante más difícil.`};
    return{w,r:best+5,msg:`Mejor tiempo: ${best} s. Hoy busca ${best+5} s en cada serie.`}}
  target=target||defTarget(ex,last);
  const inc=ex.c?2.5:1;
  const top=last.length>=target.sets&&last.every(s=>num(s.r)>=target.rmax);
  const below=s=>s.some(x=>num(x.r)<target.rmin);
  if(ex.t==='b'&&w===0){
    if(top&&nx)return{w:0,next:nx,msg:`Completaste ${target.rmax} reps en todas las series. Ya puedes pasar a ${nxN}.`};
    if(top)return{w:0,msg:`Completaste ${target.rmax} reps en todas las series. Agrega lastre (mochila con peso) para seguir progresando.`};
    const br=Math.max(...last.map(s=>num(s.r)));
    return{w:0,r:Math.min(target.rmax,br+1),msg:`Mejor serie: ${br} reps. Hoy busca ${Math.min(target.rmax,br+1)} o más; la meta es ${target.sets} × ${target.rmax}${nx?' para pasar a '+nxN:''}.`}}
  if(top)return{w:r1(w+inc),msg:`Completaste ${target.rmax} reps en todas las series: sube a ${r1(w+inc)} kg${ex.t==='b'?' de lastre':''}.`};
  if(ses.length>1&&below(last)&&below(ses[1].sets)&&Math.max(...ses[1].sets.map(s=>num(s.w)))===w){
    const lw=Math.max(0,r1(w-inc));
    return{w,msg:`Dos sesiones sin llegar a ${target.rmin} reps con ${w} kg: mantén o baja a ${lw} kg.`}}
  return{w,msg:`Mantén ${w} kg y busca sumar repeticiones hasta ${target.rmax}.`};
}
function progHTML(ex){
  const c=chainOf(ex.id);let h='';
  if(c){h+=`<p class="small" style="margin:.3rem 0">Escalera de ${esc(c.n.toLowerCase())}, de la más fácil a la más difícil:</p><ol class="steps prog">${c.ids.filter(id=>exById(id)).map(id=>`<li class="${id===ex.id?'cur':''}">${id===ex.id?`<b>${esc(exById(id).n)}</b> <span class="tag">aquí estás</span>`:`<button class="linkbtn" data-act="exInfo" data-id="${esc(id)}">${esc(exById(id).n)}</button>`}</li>`).join('')}</ol>
    <p class="small muted">${nextInChain(ex.id)?`Pasa al siguiente nivel cuando hagas 3 series de ${c.goal} con buena técnica.`:'Es el nivel más alto de esta escalera: progresa con más repeticiones o con lastre.'}</p>`}
  else h+=`<p class="small muted" style="margin:.3rem 0">${ex.t==='w'?`Doble progresión: trabaja en un rango (por ejemplo 8–12). Cuando completes el máximo en todas las series, sube ${ex.c?'2.5 kg':'1–2 kg'} y vuelve al mínimo del rango.`:ex.t==='b'?'Suma repeticiones hasta llegar a 15 por serie. Después agrega lastre (una mochila con peso) o usa una variante más difícil.':ex.t==='t'?'Suma 5–10 segundos por sesión. Al llegar a 60 s, agrega peso o usa una variante más difícil.':'Sube el tiempo poco a poco (no más de 10% por semana). Cuando el tiempo ya te acomode, sube la intensidad: velocidad, inclinación o resistencia.'}</p>`;
  const sg=suggestion(ex,null);
  h+=`<p class="sug">${sg?'Tu siguiente meta: '+esc(sg.msg):'Regístralo una vez y aquí verás tu siguiente meta.'}</p>`;
  return h;
}

function makeWeek(){
  const sp=SPLITS[ui.gw.n],tp=TPL[ui.gw.place],c=mcfg();c.routines=c.routines||[];const made={};const suf=ui.gw.place==='home'?' (casa)':'';
  const wk={};
  sp.r.forEach((name,i)=>{
    if(!made[name]){const items=tp[name].split(' ').map(x=>{const [id,st,rg]=x.split(':');const [a,b]=rg.split('-').map(Number);return{exId:id,sets:+st,rmin:a,rmax:b}}).filter(it=>exById(it.exId));
      let nm=name+suf;if(c.routines.some(r=>r.name===nm)){let k=2;while(c.routines.some(r=>r.name===nm+' '+k))k++;nm=nm+' '+k}
      const r={id:'r-'+uid(),name:nm,items};c.routines.push(r);made[name]=r.id}
    wk[sp.days[i]]=made[name];
  });
  for(let d=0;d<7;d++)if(!(d in wk))wk[d]=null;
  c.week=wk;put('config',c);
}

function addExTo(mode,id){
  const ex=exById(id);if(!ex)return;
  if(mode==='routine'&&ui.rDraft){ui.rDraft.items.push({exId:id,sets:ex.t==='c'?1:3,rmin:ex.t==='c'?'':8,rmax:ex.t==='c'?'':12});closeSheet();render();return}
  const a=docs.active;if(!a)return;
  const prev=(sessionsFor(id,a.editId)[0]||{}).sets;const n=ex.t==='c'?1:(prev?prev.length:3);
  a.exercises.push({exId:id,n:ex.n,target:null,sug:suggestion(ex,null),sets:Array.from({length:n},()=>({w:'',r:'',done:false}))});
  put('active',a);closeSheet();tab='train';ui.tsub='today';render();
  setTimeout(()=>{const c=document.querySelectorAll('.ex');if(c.length)c[c.length-1].scrollIntoView({behavior:'smooth',block:'start'})},50);
}
function finish(){
  const a=docs.active;if(!a)return;
  const exercises=[];
  a.exercises.forEach(e=>{
    const ex=exById(e.exId)||{t:'w'};
    const sets=e.sets.filter(s=>s.done||(ex.t==='c'?num(s.T):num(s.r))).map(s=>{
      if(ex.t==='c'){const o={};(ex.f||'TK').split('').forEach(k=>{if(num(s[k]))o[k]=num(s[k])});return o}
      return{w:num(s.w),r:num(s.r)};
    });
    if(sets.length)exercises.push({exId:e.exId,n:ex.n||e.n,sets});
  });
  if(!exercises.length){toast('No hay series registradas. Marca al menos una o descarta el entreno.');return}
  const id=a.editId||('w-'+uid());
  const w={kind:'workout',name:(a.name||'Entreno').trim(),date:a.start,end:a.editId?a.end:Date.now(),exercises};
  // récords
  const prs=[];
  exercises.forEach(e=>{
    const ex=exById(e.exId);if(!ex||ex.t==='c')return;
    const past=sessionsFor(e.exId,id);if(!past.length)return;
    const score=s=>ex.t==='w'?e1rm(num(s.w),num(s.r)):ex.t==='t'?num(s.r):num(s.r)+num(s.w);
    const best=Math.max(...past.flatMap(p=>p.sets.map(score)));
    const top=e.sets.reduce((b,s)=>score(s)>score(b)?s:b,e.sets[0]);
    if(score(top)>best)prs.push({n:ex.n,txt:ex.t==='w'?`${fmtSet('w',top)} (1RM estimado ${r1(e1rm(num(top.w),num(top.r)))} kg)`:fmtSet(ex.t,top)});
  });
  put(id,w);put('active',null);stopRest();render();summarySheet(w,prs);
}
let rest={end:0,total:0,iv:null,doneAt:0};
function startRest(){const s=num(cfg().rest)||90;rest.total=s;rest.end=Date.now()+s*1000;rest.doneAt=0;if(!rest.iv)rest.iv=setInterval(drawRest,250);drawRest()}
function stopRest(){clearInterval(rest.iv);rest.iv=null;rest.end=0;$('#rest').hidden=true}
function drawRest(){
  const el=$('#rest');const left=(rest.end-Date.now())/1000;
  if(left<=0){
    if(!rest.doneAt){rest.doneAt=Date.now();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){};el.hidden=false;el.innerHTML='<span class="time">A darle</span><button data-act="restSkip">Cerrar</button>'}
    else if(Date.now()-rest.doneAt>4000)stopRest();
    return;
  }
  el.hidden=false;
  el.innerHTML=`<span class="time" aria-live="off">${mmss(left)}</span><button data-act="restAdd" data-d="-15">−15</button><button data-act="restAdd" data-d="15">+15</button><button data-act="restSkip">Saltar</button><span class="bar" style="width:${Math.max(0,100*left/rest.total)}%"></span>`;
}

const IMPORT_BTN='<label class="btn block" style="margin-top:.5rem;text-align:center">Importar respaldo<input type="file" accept=".json,application/json" data-f="import" hidden></label>';
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||typeof data!=='object'||Array.isArray(data))throw 0;let n=0;
  for(const k in data){const v=data[k];if(!v||typeof v!=='object'||!v.kind)continue;if(k==='config'&&docs.config){const c=Object.assign({},docs.config,v);c.routines=mergeBy(docs.config.routines,v.routines);c.custom=mergeBy(docs.config.custom,v.custom);c.foods=mergeBy(docs.config.foods,v.foods);put('config',c)}else put(k,v);n++}
  render();toast(n?'Respaldo importado ('+n+' registros).':'El archivo no tiene datos de la Bitácora.')}catch(e){toast('No se pudo leer el archivo de respaldo.')}};r.readAsText(file)}
function mergeBy(a,b){const m={};(a||[]).forEach(x=>m[x.id]=x);(b||[]).forEach(x=>m[x.id]=x);return Object.values(m)}
function fallbackDownload(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function doExport(){
  const d0=new Date(),nm=`bitacora-respaldo-${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}.json`;
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(!dl){fallbackDownload(nm,JSON.stringify(docs,null,1));toast('Respaldo descargado');return}
  try{
    const d=new Date();const name=`bitacora-respaldo-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;

  }catch(e){if(e&&e.code!=='declined')toast('No se pudo exportar el respaldo.')}
}

  if(kg&&h)o.imc=kg/((h/100)**2);
  if(kg&&h&&a){o.bmr=10*kg+6.25*h-5*a+(p.sex==='M'?-161:5);o.tdee=o.bmr*num(p.act);o.target=o.tdee*(1+({definir:-0.15,mantener:0,volumen:0.1}[p.obj]||0));
    const P=Math.round(kg*2),F=Math.round(o.target*0.25/9),C=Math.max(0,Math.round((o.target-P*4-F*9)/4));o.macros={p:P,c:C,f:F}}

function lineChart(pts,unit){
  pts=pts.filter(p=>isFinite(p.y)&&p.y>0).sort((a,b)=>a.x-b.x);
  if(!pts.length)return '<p class="muted small">Sin datos todavía.</p>';
  if(pts.length===1)return `<p class="small">Un registro: <b>${r1(pts[0].y)} ${esc(unit)}</b>. Con dos o más verás la línea.</p>`;
  const W=320,H=160,L=36,R=10,T=12,B=24;
  let x0=pts[0].x,x1=pts[pts.length-1].x;if(x1===x0)x1=x0+1;
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));const pd=(y1-y0)*0.12||Math.max(1,y1*0.05);y0-=pd;y1+=pd;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const grid=[0,0.5,1].map(t=>{const v=y0+(y1-y0)*t;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L-4}" y="${Y(v)+3}" class="ya">${r1(v)}</text>`}).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de ${esc(unit)}">${grid}<path d="${d}" class="ln"/>${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" class="dt"/>`).join('')}<text x="${L}" y="${H-6}" class="xa" text-anchor="start">${sdf.format(new Date(x0))}</text><text x="${W-R}" y="${H-6}" class="xa" text-anchor="end">${sdf.format(new Date(last.x))}</text></svg>`;
}
function barChart(vals,labels){
  const W=320,H=150,L=8,R=8,T=14,B=22,n=vals.length,mx=Math.max(1,...vals),bw=(W-L-R)/n;

}

// ---- plan automático ----
function plan(){const p=cfg().plan||{};const fo={},sh={},fx={};MEALS.forEach((m,i)=>{fo[m]=((p.foods||{})[m]||[]).filter(id=>foodById(id));sh[m]=num((p.share||{})[m])||[25,35,25,15][i];fx[m]=Object.assign({},(p.fixed||{})[m]||{})});return{foods:fo,share:sh,fixed:fx,res:p.res||null,mode:p.mode==='manual'?'manual':'auto'}}
function mplan(){const c=mcfg();const p=plan();c.plan={foods:p.foods,share:p.share,fixed:p.fixed,res:p.res,mode:p.mode};return c.plan}
function gMax(f){return f.cat==='grasas'?40:f.cat==='otros'?30:f.cat==='bebidas'?500:f.cat==='suplementos'?60:350}
function gMin(f){return f.cat==='grasas'||f.cat==='otros'?5:20}
function solveMeal(fs,T){
  if(!fs.length)return[];
  const A=fs.map(f=>[f.p,f.c,f.f]),Tv=[T.p,T.c,T.f],w=Tv.map((t,m)=>(m===0?2:1)/Math.max(t,5)**2);
  const g=fs.map(f=>Math.min(gMax(f),Math.max(gMin(f),kcal(T.p,T.c,T.f)/fs.length/Math.max(fk(f),0.1))));
  for(let it=0;it<400;it++)for(let i=0;i<fs.length;i++){let num_=0,den=1e-9;for(let m=0;m<3;m++){let r=Tv[m];for(let j=0;j<fs.length;j++)if(j!==i)r-=A[j][m]*g[j];num_+=w[m]*A[i][m]*r;den+=w[m]*A[i][m]**2}g[i]=Math.min(gMax(fs[i]),Math.max(gMin(fs[i]),num_/den))}
  return fs.map((f,i)=>({fid:f.id,g:Math.max(gMin(f),Math.round(g[i]/5)*5)}));
}
function genPlan(){
  const p=plan(),G=goals(),tot=MEALS.reduce((a,m)=>a+(p.foods[m].length?p.share[m]:0),0)||1,res={};
  MEALS.forEach(m=>{const k=p.share[m]/tot,fx=Object.assign({},p.mode==='manual'&&p.res?Object.fromEntries((p.res[m]||[]).map(x=>[x.fid,x.g])):{},p.fixed[m]||{});const T={p:G.p*k,c:G.c*k,f:G.f*k};
    p.foods[m].forEach(id=>{if(fx[id]!=null){const f=foodById(id);T.p-=f.p*fx[id];T.c-=f.c*fx[id];T.f-=f.f*fx[id]}});['p','c','f'].forEach(q=>T[q]=Math.max(0,T[q]));
    const free=p.foods[m].filter(id=>fx[id]==null).map(foodById).filter(Boolean);const sol=solveMeal(free,T);
    res[m]=p.foods[m].map(id=>fx[id]!=null?{fid:id,g:fx[id]}:sol.find(x=>x.fid===id)).filter(Boolean)});
  return res;
}
function genPlanFrom(){return genPlan()}
function planItems(res){const out=[];MEALS.forEach(m=>(res[m]||[]).forEach(x=>{const f=foodById(x.fid);if(f)out.push({meal:m,f,g:x.g})}));return out}

  if(!gk)return h+`<div class="card"><p>Primero fija tus metas de macros.</p><button class="btn primary" data-act="goalsOpen">Poner metas</button></div>`;
  const low=o.bmr?gk<o.bmr:gk<1400;
  if(low)h+=`<p class="sug">Tus metas suman ${Math.round(gk)} calorías${o.bmr?`, menos que tu metabolismo basal estimado (${Math.round(o.bmr)} calorías)`:''}. Un déficit así de grande suele frenar la pérdida de grasa y costar músculo. Te conviene revisar tus metas en Perfil o con un nutriólogo antes de seguir este plan.</p>`;
  const res=p.res;const byMeal={};if(res)planItems(res).forEach(x=>{(byMeal[x.meal]=byMeal[x.meal]||[]).push(x)});
  MEALS.forEach(m=>{
    const ids=p.foods[m];const items=byMeal[m]||[];const mt=items.reduce((a,x)=>({p:a.p+x.f.p*x.g,c:a.c+x.f.c*x.g,f:a.f+x.f.f*x.g,k:a.k+fk(x.f)*x.g}),{p:0,c:0,f:0,k:0});
    h+=`<div class="card"><div class="row"><h3 style="flex:1">${m}</h3><label class="small muted">% del día <input class="field pct" inputmode="numeric" data-f="pshare" data-meal="${m}" value="${p.share[m]}" aria-label="Porcentaje del día para ${m}"></label></div>
    ${ids.length?`<ul class="list">${ids.map((id,i)=>{const f=foodById(id);const it=items.find(x=>x.f.id===id);const fx=p.fixed[m][id]!=null;return `<li class="row2"><button class="item" data-act="planEdit" data-meal="${m}" data-id="${esc(id)}"><div class="t"><b>${esc(f.n)}${fx?' <span class="tag">ajustado</span>':''}</b><span>${it?`${it.g} g. P ${r1(f.p*it.g)}, C ${r1(f.c*it.g)}, G ${r1(f.f*it.g)}`:'Sin calcular. Toca para poner gramos'}</span></div>${it?`<span class="small">${Math.round(fk(f)*it.g)} cal</span>`:''}</button><button class="btn sm ghost danger" data-act="planDel" data-meal="${m}" data-i="${i}" aria-label="Quitar">✕</button></li>`}).join('')}</ul>`:'<p class="small muted">Sin alimentos. Esta comida no se incluye en el plan.</p>'}
    ${items.length?`<p class="small muted" style="margin:.3rem 0">${Math.round(mt.k)} calorías</p>`:''}

  });

    if(G.p&&t.p>G.p*1.15||G.c&&t.c>G.c*1.15||G.f&&t.f>G.f*1.15)tips.push('Algún macro se pasa porque ciertos alimentos tienen una cantidad mínima. Quita alguno o cambia de comida.');
    h+=`<div class="card"><h3>Total del plan</h3><div style="margin-top:.4rem">${mbar('Proteína',t.p,G.p,'var(--prot)')}${mbar('Carbohidratos',t.c,G.c,'var(--carb)')}${mbar('Grasa',t.f,G.f,'var(--fat)')}</div><p class="small muted">${Math.round(t.k)} de ${Math.round(gk)} calorías. Cantidades en crudo o cocido según cómo esté el alimento en la lista.</p>${tips.map(x=>`<p class="sug">${x}</p>`).join('')}
    <button class="btn primary block" data-act="dietCopy" style="margin-bottom:.5rem">Copiar mi dieta</button>
    <button class="btn block" data-act="planLog">Registrar el plan en ${ui.fday===dkey()?'hoy':esc(fmtDate(parseKey(ui.fday).getTime()))}</button></div>`;
  }
  return h;
}

const money=n=>'$'+Math.round(n).toLocaleString('es-MX');
function shopList(days){
  const res=plan().res;if(!res)return null;const tot={};
  MEALS.forEach(m=>(res[m]||[]).forEach(x=>{tot[x.fid]=(tot[x.fid]||0)+num(x.g)}));
  return Object.entries(tot).map(([fid,g])=>{const f=foodById(fid);if(!f)return null;const need=g*days,liq=f.cat==='bebidas'||/^leche|bebida|jugo|kefir|yogur-bebible/.test(fid);
    const raw=RAW[fid];let qty,note='';
    let buy=need;
    if(raw){const b=need*raw[0];buy=b;qty=fmtQ(b,false);note=`Comprar ${raw[1]}. Rinde unos ${fmtQ(need,false)} cocido`}
    else if(f.ug&&/pieza/.test(f.u)){const n=Math.ceil(need/f.ug-0.05);buy=n*f.ug;qty=`${n} ${n===1?'pieza':'piezas'}`;note=`unos ${fmtQ(need,false)}`}
    else{qty=fmtQ(need,liq);if(f.ug&&f.u&&!/cucharad|puño|disparo/.test(f.u))note=`unos ${Math.ceil(need/f.ug-0.05)} × ${f.u}`}
    const pr=priceOf(fid),cost=buy/1000*pr;
    return{fid,n:f.n,cat:f.cat,qty,note,liq,pr,cost};
  }).filter(Boolean);
}

  <div><label class="lbl">Estatura (cm)</label><input class="field" inputmode="decimal" data-pf="height" value="${esc(p.height)}" placeholder="cm"></div><div><label class="lbl">Peso</label><button class="field" style="text-align:left" data-act="goBody">${o.kg?r1(o.kg)+' kg':'Registrar'}</button></div></div>

  <div class="card"><h3>Metabolismo</h3>${o.bmr?`<div class="stats" style="margin:.6rem 0"><div><div class="stat">${Math.round(o.bmr)}</div><span>basal (calorías)</span></div><div><div class="stat">${Math.round(o.tdee)}</div><span>gasto diario</span></div><div><div class="stat">${Math.round(o.target)}</div><span>para tu objetivo</span></div></div>
  <p class="small muted">Basal con la fórmula de Mifflin-St Jeor, multiplicado por tu nivel de actividad. Es una estimación: ajústala según cómo cambie tu peso en 2–3 semanas.</p>
  <h3 style="font-size:1rem;margin-top:.6rem">Macros sugeridos</h3><p class="small">Proteína ${o.macros.p} g (2 g por kg), grasa ${o.macros.f} g (25% de las calorías), carbos ${o.macros.c} g (el resto).</p><button class="btn sm primary" data-act="applyMacros">Usar como mis metas</button>`:'<p class="small muted">Necesita peso, estatura y edad.</p>'}</div>
  <div class="card"><h3>Agua recomendada</h3>${o.water?`<p><span class="stat">${(o.water/1000).toFixed(1)}</span> <span class="muted">litros al día, +0.5 L los días que entrenas</span></p>`:'<p class="small muted">Necesita tu peso.</p>'}</div>
  <div class="card"><h3>Ajustes</h3><label class="lbl" for="restIn2">Descanso entre series (segundos)</label><input id="restIn2" class="field" inputmode="numeric" data-sf="rest" value="${esc(cfg().rest||90)}"><button class="btn block" style="margin-top:.8rem" data-act="export">Exportar respaldo (JSON)</button>${IMPORT_BTN}<p class="small muted">Sesión: ${esc((window.FB&&FB.email)||'')}. Tus datos se guardan en tu cuenta y solo tú los ves.</p><button class="btn block ghost" data-act="logout">Cerrar sesión</button></div>`;
}

        if(r&&isFinite(num(r.p))){F.querySelector('[name="mode"]').value='100';F.querySelector('[name="p"]').value=r2(num(r.p));F.querySelector('[name="c"]').value=r2(num(r.c));F.querySelector('[name="f"]').value=r2(num(r.f));fePrev();toast('Estimación lista. Corrígela con la etiqueta si la tienes.')}}
      catch(e){toast(e&&e.code==='rate_limited'?'Espera un momento e inténtalo de nuevo.':'No se pudo estimar. Captura los valores de la etiqueta.')}
      if(el.isConnected){el.disabled=false;el.textContent='Estimar con IA a partir del nombre'}break}
    case 'wSave':{const kg=num($('#wIn').value);if(!kg){toast('Escribe tu peso en kg.');break}const b=mbody(),k=dkey();b.weights=b.weights.filter(w=>w.d!==k);b.weights.push({d:k,kg});put('body',b);render();toast('Peso guardado');break}

async function compress(file){try{const img=await createImageBitmap(file);const s=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.72))}catch(e){return file}}
async function uploadPhoto(file){
  if(!file||!CAP.assets)return;toast('Subiendo foto…');
  try{const blob=await compress(file);const r=await CAP.assets.upload(blob);if(!docs.photos)docs.photos={kind:'photos',items:[]};docs.photos.items.push({id:r.id,d:dkey()});put('photos',docs.photos);render();toast('Foto guardada')}
  catch(e){toast(e&&e.message?'No se pudo subir: '+e.message:'No se pudo subir la foto.')}
}
function input2(t,f){
  if(f==='fg')famtPrev();
  else if(f==='fe'){if(t.name==='mode'){const F=$('#feform'),pg=F.querySelector('[name="pg"]');const dv=m=>m==='g'?1:m==='100'?100:num(pg.value);const od=dv(ui.feMode);if(t.value==='por'&&!num(pg.value))pg.value=100;const nd=dv(t.value);
    if(od&&nd)['p','c','f','k'].forEach(k=>{const el=F.querySelector(`[name="${k}"]`);if(k==='k'&&el.value.trim()==='')return;el.value=Math.round(num(el.value)/od*nd*1000)/1000});ui.feMode=t.value}fePrev()}
  else if(f==='fq'){ui.fq=t.value;$('#foodList').innerHTML=foodListHTML(filteredFoods(ui.fq,ui.fcat),'foodEdit')}
  else if(f==='fpq'){ui.fpQ=t.value;$('#fpList').innerHTML=foodListHTML(filteredFoods(ui.fpQ,ui.fpCat),ui.fpAct,ui.fpMeal)}
  else if(f==='mf'){const el=$('#navyOut');const F=$('#measForm');if(el&&F&&!num(F.querySelector('[name="grasa"]').value)){const v=measNavy();if(v>2&&v<60)el.textContent=`% de grasa estimado (método Marina de EE. UU.): ${r1(v)} %`}}
}
function change2(t){
  if(t.dataset.pf){const c=mcfg();c.profile=Object.assign(prof(),{[t.dataset.pf]:t.value});put('config',c);render()}
  else if(t.dataset.f==='pex'){ui.pex=t.value;render()}
  else if(t.dataset.f==='wday'){const day=+t.dataset.d;if(t.value==='__new'){ui.rDraft={id:'r-'+uid(),name:DAYS[day],items:[],assignDay:day};render();window.scrollTo(0,0)}else{const c=mcfg();c.week=Object.assign({},c.week||{},{[day]:t.value||null});put('config',c);render()}}
  else if(t.dataset.f==='shopdays'){const v=Math.round(num(t.value));if(v>0&&v<=60){const c=mcfg();c.shop=Object.assign(shopCfg(),{days:v});put('config',c);render()}}
  else if(t.dataset.f==='shopchk'){const c=mcfg(),sc=shopCfg();if(t.checked)sc.checked[t.dataset.id]=true;else delete sc.checked[t.dataset.id];c.shop=sc;put('config',c);t.closest('.shop').classList.toggle('got',t.checked)}
  else if(t.dataset.f==='pshare'){const pl=mplan();pl.share[t.dataset.meal]=Math.max(0,num(t.value));put('config',mcfg());render()}
  else if(t.dataset.f==='pmeas'){ui.pmeas=t.value;render()}
  else if(t.dataset.f==='photo'){uploadPhoto(t.files&&t.files[0]);t.value=''}
  else if(t.dataset.f==='import'){importFile(t.files&&t.files[0]);t.value=''}
}
function repairFoods(){
  const bad=x=>x&&kcal(num(x.p),num(x.c),num(x.f))>9.2&&kcal(num(x.p),num(x.c),num(x.f))/100<=9.2;const fix=x=>{x.p=num(x.p)/100;x.c=num(x.c)/100;x.f=num(x.f)/100};let n=0;
  const c=docs.config;if(c&&c.foods&&c.foods.some(bad)){c.foods.forEach(x=>{if(bad(x)){fix(x);n++}});if(c.plan)c.plan.res=null;put('config',c)}
  Object.keys(docs).forEach(k=>{const d=docs[k];if(d&&d.kind==='day'&&(d.foods||[]).some(bad)){d.foods.forEach(x=>{if(bad(x)){fix(x);n++}});put(k,d)}});
  if(n){render();toast('Corregí '+n+' alimentos que tenían valores por 100 g guardados como por gramo.')}
}
let repaired=false;const _setStatus=setStatus;setStatus=function(x){_setStatus(x);if(x==='sync'&&!repaired){repaired=true;setTimeout(repairFoods,0)}};
setTimeout(()=>{if(!Sync.col)repairFoods()},1500);


function startApp(uid){LS='bitacora-v1-'+uid;docs={};Sync.col=null;loadLocal();render();connect()}
window.startApp=startApp;
